name: Feature request
description: Suggest a prompt optimization, bridge, or OSS workflow improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What workflow should this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should vibeX do?
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data handling
      options:
        - Derived metadata only
        - Needs raw prompt temporarily
        - Unsure
    validations:
      required: true
